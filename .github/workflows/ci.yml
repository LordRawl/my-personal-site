# Сборка и деплой devivan.tech (резюме).
#
# Три job с зависимостями: verify -> build -> deploy.
# Сборка идёт на GitHub-hosted раннерах, на сервер едет только артефакт
# .output: Node там ничего не собирает, а просто запускает готовые файлы.
#
# Секреты (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     IP сервера
#   DEPLOY_USER     ssh-пользователь (deploy)
#   DEPLOY_SSH_KEY  приватный ключ без пароля
#   DEPLOY_PATH     путь на сервере (/var/www/devivan)
#   SITE_URL        публичный адрес сайта, попадает в runtimeConfig.public

name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два деплоя одновременно перетирали бы друг друга.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Проверки
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # npm ci, а не npm install: точная версия из package-lock.json.
      # lockfile не должен меняться здесь, иначе расхождение с локальной
      # версией соберётся на проде.
      - run: npm ci

      - run: npm run lint

  build:
    name: Сборка
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Сборка на раннере требует около 2 ГБ RAM, на бесплатном ubuntu-latest
      # памяти с запасом. Файл .env в репозитории нет (он в .gitignore),
      # поэтому публичный адрес передаём переменной окружения: nuxt.config
      # читает его в runtimeConfig.public.
      - name: Собираю .output
        env:
          NUXT_PUBLIC_SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run build

      # Архивируем .output целиком: внутри уже лежат рантайм-зависимости,
      # поэтому на сервере не нужен npm ci для запуска приложения.
      - name: Архивирую артефакт
        run: |
          tar -czf devivan-output.tar.gz .output deploy/ecosystem.config.cjs
          du -h devivan-output.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: devivan-output
          path: devivan-output.tar.gz
          retention-days: 7

  deploy:
    name: Деплой на сервер
    needs: build
    # Секреты недоступны на ветках из форков, и запускать деплой оттуда нельзя:
    # ключ сервера не должен попасть в чужие руки.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devivan-output

      # Ключ обязательно чистим от CR. GitHub хранит секреты из <textarea>, где
      # браузер нормализует переводы строк в \r\n, а ssh такой ключ не
      # разбирает: он молча игнорируется, и вызов падает с
      # "Permission denied (publickey,password)" — ключ при этом вовсе не
      # виден в списке предъявленных.
      # IdentitiesOnly не даёт ssh подставлять другие ключи раннера, из-за
      # чего неверный ключ выглядел бы как «сервер не пускает».
      - name: Готовлю SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Копирую артефакт и скрипт на сервер
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
          REMOTE_TAR: /tmp/devivan-output-${{ github.run_id }}.tar.gz
        run: |
          # -i обязателен вместе с IdentitiesOnly: без него ssh не станет
          # искать ключ в ~/.ssh и предъявит ни одного, отсюда
          # "Permission denied (publickey,password)".
          SSH_OPTS="-i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          scp $SSH_OPTS devivan-output.tar.gz "$USER@$HOST:$REMOTE_TAR"
          scp $SSH_OPTS deploy/deploy.sh "$USER@$HOST:$PATH_ON_SERVER/deploy.sh"
          ssh $SSH_OPTS "$USER@$HOST" "chmod +x $PATH_ON_SERVER/deploy.sh"

      - name: Распаковываю и деплою
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
          REMOTE_TAR: /tmp/devivan-output-${{ github.run_id }}.tar.gz
        run: |
          SSH_OPTS="-i ~/.ssh/id_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          ssh $SSH_OPTS "$USER@$HOST" <<EOF
          set -euo pipefail
          cd $PATH_ON_SERVER
          STAGE=/tmp/devivan-unpack-$GITHUB_RUN_ID
          rm -rf "\$STAGE"
          mkdir -p "\$STAGE"
          tar -xzf $REMOTE_TAR -C "\$STAGE"
          BUNDLE="\$STAGE" BRANCH=\${GITHUB_SHA:-main} bash ./deploy.sh
          rm -rf "\$STAGE" $REMOTE_TAR
          EOF
