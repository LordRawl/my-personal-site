# Конфиг nginx для devivan.tech (резюме Иван Есина).
#
# Установка:
#   sudo cp /var/www/devivan/deploy/nginx.conf /etc/nginx/sites-available/devivan
#   sudo ln -s /etc/nginx/sites-available/devivan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ПОЧЕМУ ТАК:
#   - Приложение слушает 127.0.0.1:3001, наружу его не отдаём: так TLS и
#     rate limit нельзя обойти, зайдя напрямую на порт.
#   - Статику (_nuxt/*, favicons, шрифты) nginx отдаёт с диска, а не через
#     Node. В _nuxt файлы с хешем в имени — их можно кэшировать навсегда.
#     HTML собирает Nitro, поэтому locations на статику только try_files, без
#     подстановки index.html: у SSR-приложения index.html на диске нет.

# Защита формы: приложение само ограничивает 3 заявки на 10 минут на IP
# (в памяти процесса), а это внешний слой от потока ботов.
limit_req_zone $binary_remote_addr zone=devivan_api:10m rate=10r/m;

upstream devivan_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ПОРЯДОК УСТАНОВКИ (без этого nginx не запустится):
#   1. Выпусти временный самоподписанный сертификат, иначе nginx не стартует:
#        sudo mkdir -p /etc/nginx/ssl
#        sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
#          -keyout /etc/nginx/ssl/devivan.key \
#          -out /etc/nginx/ssl/devivan.crt -subj "/CN=devivan.tech"
#      и подставь эти пути вместо letsencrypt в server {} для 443.
#   2. Скопируй конфиг, включи сайт, проверь:
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Убедись, что DNS домена уже указывает на 2.58.124.128, затем выпусти
#      настоящий сертификат — certbot перепишет пути и добавит редирект:
#        sudo certbot --nginx -d devivan.tech -d www.devivan.tech
#   4. Проверь автообновление: sudo systemctl status certbot.timer

server {
    listen 80;
    listen [::]:80;
    server_name devivan.tech www.devivan.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 пишется в самой директиве listen: отдельная директива "http2 on"
    # появилась только в nginx 1.25, а в Ubuntu 24.04 идёт 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devivan.tech www.devivan.tech;

    # Пути заполняет certbot --nginx. До выпуска сертификата строки ниже
    # нужно заменить на пути к самоподписанному сертификату.
    ssl_certificate /etc/letsencrypt/live/devivan.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devivan.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    access_log /var/log/nginx/devivan.access.log;
    error_log  /var/log/nginx/devivan.error.log;

    # Каталог со статикой из .output/public. deploy.sh переключает артефакт
    # переименованием на уровне .output, поэтому путь остаётся валидным после
    # каждого деплоя и в nginx менять нечего.
    root /var/www/devivan/.output/public;
    index index.html;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Сборка и рендер живут в Node: /api/contact ходит в Telegram и держит
    # токен бота, который не должен попасть в браузер.
    location /api/ {
        limit_req zone=devivan_api burst=5 nodelay;
        proxy_pass http://devivan_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

# Стили и скрипты Nuxt: имя файла содержит хеш содержимого, поэтому при
    # следующем деплое файл с тем же именем не меняется — можно кэшировать
    # навсегда. Директива expires не используется: вместе с add_header она
    # добавляет второй заголовок Cache-Control, и браузер получает два.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # =404, а не @app: отсутствующий чанк должен отдавать 404, иначе
        # Nitro ответит на запрос картинки страницей с кодом 200.
        try_files $uri =404;
    }

# Шрифты @nuxt/fonts: имя файла содержит хеш, кэшируем навсегда.
    location /_fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # favicons, og.png: статика с диска, но имя файла не содержит хеша —
    # кэшируем на неделю, чтобы не заливать картинку при каждом деплое.
    location ~* \.(?:png|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri @app;
    }

    # Всё, что не нашлось на диске, рендерит Nitro.
    location @app {
        proxy_pass http://devivan_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
