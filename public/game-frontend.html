<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frontend Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: night-city arcade. Header, 16:9 stage with DOM HUD over canvas, three info panels, footer. Single dark theme by design. */
:root{
  --bg:#060a1c; --panel:#0c1230; --panel2:#111943; --line:#1d2860; --fg:#e9edff; --muted:#8e9ad2;
  --accent:#5b7cff; --accent2:#8a5bff; --good:#35e08a; --bad:#ff4d6d; --bonus:#4aa8ff; --gold:#ffc83d;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(900px 400px at 10% -10%,rgba(91,124,255,.14),transparent 60%),radial-gradient(700px 380px at 100% 0,rgba(138,91,255,.10),transparent 60%)}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:15px;color:#bcd0ff;
  background:radial-gradient(circle at 30% 25%,#2a3b9a,#121a4d);border:1px solid #2f43b5;box-shadow:0 0 18px rgba(91,124,255,.35)}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:700;white-space:nowrap}
.pill svg{width:18px;height:18px;fill:var(--gold)}
.pill b{font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:700}
.tbtn{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 10px;border-radius:10px;display:flex;align-items:center;gap:6px;font-weight:600}
.tbtn:hover{color:var(--fg);border-color:var(--line)}
.tbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn[aria-pressed="true"]{color:var(--good)}

.stage{position:relative;width:100%;aspect-ratio:40/27;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a1030;box-shadow:0 0 0 1px rgba(91,124,255,.08),0 24px 60px -24px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none}
.stage.portrait{aspect-ratio:12/19}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.hearts{position:absolute;left:14px;top:14px;display:flex;gap:6px;pointer-events:none}
.hearts svg{width:30px;height:30px;fill:#ff4d6d;filter:drop-shadow(0 0 6px rgba(255,77,109,.6));transition:transform .2s}
.hearts svg.dead{fill:transparent;stroke:#ff4d6d55;stroke-width:1.6;filter:none;opacity:.7}
.buff{position:absolute;left:14px;top:54px;display:none;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;color:#ffd9a3;background:rgba(20,14,8,.6);border:1px solid #7a5420;padding:4px 10px;border-radius:999px}
.buff.on{display:flex}
.goal{position:absolute;right:14px;top:14px;width:min(268px,44%);padding:14px 16px;border-radius:12px;background:rgba(9,13,36,.58);border:1px solid var(--line);pointer-events:none}
.goal h3{margin:0 0 6px;font-size:14px;font-weight:800}
.goal p{margin:0 0 10px;color:#b9c3f2;font-size:13px}
.bar{height:7px;border-radius:99px;background:#1a2358;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd27d,#5df0a4);border-radius:99px;transition:width .25s}
.goal .row{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pausebtn{margin-left:auto;display:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--muted)}
.pausebtn.on{display:block}
.toasts{z-index:60;position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,92%)}
.toast{background:linear-gradient(180deg,#1b2160,#10173f);border:1px solid #4a5cd6;border-radius:12px;padding:10px 16px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .35s ease-out}
.toast small{display:block;color:var(--gold);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.toast b{display:block;font-size:15px}
.toast span{display:block;color:#b9c3f2;font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.count{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;font-family:var(--mono);font-weight:700;font-size:min(22vw,150px);color:#fff;text-shadow:0 0 40px rgba(91,124,255,.9)}
.count.on{display:grid}
.count span{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.idlebtn{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:none}
.idlebtn.on{display:block}

.game-btn{border:0;border-radius:12px;padding:12px 22px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(180deg,#6d8bff,#4a62e8);box-shadow:0 8px 24px -8px rgba(91,124,255,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.game-btn:hover{filter:brightness(1.08)}
.game-btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--fg)}
.game-btn.ghost:hover{border-color:#3b4da8}
.game-btn.danger{background:linear-gradient(180deg,#ff6b84,#e23a5a)}
.game-btn.sm{padding:8px 14px;font-size:13px}

.mlayer{z-index:20;position:absolute;inset:0;display:flex;padding:14px;background:rgba(3,6,20,.64);backdrop-filter:blur(2px);overflow:auto}
.modal{margin:auto;flex:none;width:min(480px,100%);background:linear-gradient(180deg,#121a47,#0b1130);border:1px solid #2b3a8c;border-radius:18px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:mpop .25s ease-out}
@keyframes mpop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.modal .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.modal p{margin:8px 0;color:#c4ccf5}
.modal .warn{padding:9px 12px;border-radius:10px;background:rgba(255,200,61,.10);border:1px solid rgba(255,200,61,.4);color:#ffe29a;font-size:13px}
.modal .sec{margin-top:14px}
.modal .sec h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:10px;background:#0a0f2b;border:1.5px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:700}
.chip img{width:28px;height:28px}
.chip.good{border-color:var(--good)}.chip.bad{border-color:var(--bad)}.chip.bonus{border-color:var(--bonus)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.acts .game-btn{flex:1 1 auto}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:14px 0 0;font-size:14px}
.stats dt{color:var(--muted)}.stats dd{margin:0;text-align:right;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.stats .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px;color:var(--fg)}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 14px rgba(255,200,61,.5);margin:6px 0}
.stars .off{color:#2c366f;text-shadow:none}
.steps{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#18215a;border:1px solid #3547b5;font-family:var(--mono);font-weight:700}
.steps b{display:block}.steps span{color:#b4bdee;font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}

.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:-6px;padding:0 4px}
.kbd{display:inline-grid;place-items:center;min-width:34px;height:44px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:#0b1130;font-family:var(--mono);font-size:13px;color:var(--fg)}
.kbd.ar{min-width:44px;height:44px;padding:0;border-radius:11px}.kbd.ar svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.tpad{display:none;gap:10px}
.hint.tp{display:none}
.tpad button{width:64px;height:48px;border-radius:12px;border:1px solid #3547b5;background:#111a4d;font-size:20px;touch-action:none;color:var(--fg)}
.tpad button:active{background:#2a3b9a}
@media (pointer:coarse),(max-width:700px){.tpad{display:flex}.hint.kb{display:none}.hint.tp{display:flex}}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.game-panel{background:linear-gradient(180deg,rgba(17,25,67,.55),rgba(11,17,48,.55));border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.game-panel h2{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.game-panel h2 i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px}
.game-panel h2 i.g{background:rgba(53,224,138,.15);color:var(--good);border:1.5px solid var(--good)}
.game-panel h2 i.r{background:rgba(255,77,109,.15);color:var(--bad);border:1.5px solid var(--bad)}
.lvls{display:flex;gap:10px;flex-wrap:wrap}
.lv{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;background:#0e1540;border:2px solid #2a3678;font-weight:800;font-size:18px;font-family:var(--mono);color:var(--fg)}
.lv:disabled{cursor:not-allowed;color:#6a76b8}
.lv.cur{border-color:#38f0b5;box-shadow:0 0 0 3px rgba(56,240,181,.15),0 0 18px rgba(56,240,181,.35);background:#0d2a3e}
.lv.done{border-color:#4a62e8}
.lv svg{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;padding:3px;border-radius:50%;background:#1a2358;stroke:#9aa7ef;fill:none;stroke-width:2}
.lv .st{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gold);letter-spacing:1px;white-space:nowrap;font-family:var(--ui)}
.lvwrap{padding-bottom:18px}
.note{margin:14px 0 0;color:var(--muted);font-size:13px}
.ach{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ach h3{margin:0 0 8px;font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.achrow{display:flex;gap:6px;flex-wrap:wrap}
.badge{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#0e1540;border:1px solid var(--line);cursor:help}
.badge svg{width:16px;height:16px}
.badge.on{border-color:#8a6a1d;background:#2a2108}.badge.on svg{fill:var(--gold)}
.badge.off svg{stroke:#58649f;fill:none;stroke-width:2}
.achtext{margin:8px 0 0;min-height:36px;color:#b9c3f2;font-size:12.5px}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.it{min-width:0;padding:8px 2px 6px;border-radius:12px;border:1.5px solid var(--line);background:#0a0f2b;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#d5dcff}
.it img{width:42px;height:42px}.it span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:0}
.it.good{border-color:rgba(53,224,138,.55)}.it.bad{border-color:rgba(255,77,109,.55)}.it.bonus{border-color:rgba(74,168,255,.6)}
.it:hover,.it.sel{background:#141c52}
.reset{margin-top:12px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.foot .l{display:flex;gap:14px;align-items:center;min-width:0}
.foot b{display:block;font-size:15px}.foot span{color:var(--muted);font-size:13px}
.foot .r{max-width:340px;color:var(--muted);font-size:12px;text-align:right}
.foot a{color:var(--accent)}
@media (max-width:980px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
@media (max-width:640px){.grid3{grid-template-columns:1fr}.goal{width:min(210px,52%);padding:10px 12px}.goal p{display:none}.goal h3{font-size:12px;margin-bottom:6px}.hearts svg{width:24px;height:24px}.foot .r{text-align:left}.pills{width:100%}.pill{padding:7px 12px}.modal{padding:16px}.modal h2{font-size:19px}.modal p{font-size:13px;margin:6px 0}.modal .sec{margin-top:10px}.chip{font-size:11px;padding:4px 8px 4px 5px}.chip img{width:22px;height:22px}.acts{margin-top:14px}.modal img.cat{height:72px!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">&lt;/&gt;</span>
      <div><h1>Frontend Game</h1><p data-i18n="sub"></p></div>
    </div>
    <div class="pills">
      <div class="pill" id="pLevel"></div>
      <div class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.100 4.900 1.300 7L12 17.800 5.800 21.300l1.300-7L2 9.400l7-.9z"/></svg><span data-i18n="score"></span><b id="pScore">0</b></div>
      <button class="tbtn" id="bSound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndwave" d="M16 9a4 4 0 010 6M18.500 6.500a8 8 0 010 11"/></svg><span data-i18n="sound"></span></button>
      <button class="tbtn" id="bLang" aria-label="Language">EN</button>
      <button class="tbtn" id="bHow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 114 2c-.9.600-1.500 1.100-1.500 2M12 17h.01"/></svg><span data-i18n="how"></span></button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Frontend Game">
    <canvas id="cv"></canvas>
    <div class="hearts" id="hearts" role="img"></div>
    <div class="buff" id="buff"></div>
        <aside class="goal" id="goal">
      <h3 data-i18n="goalTitle"></h3>
      <p id="goalText"></p>
      <div class="bar"><i id="goalBar"></i></div>
      <div class="row"><span id="goalTime">0:00</span><span id="goalCount"></span></div>
    </aside>
    <div class="toasts" id="toasts"></div>
    <div class="count" id="count"></div>
    <button class="game-btn idlebtn" id="idleBtn"></button>
    <div class="mlayer" id="mlayer" hidden></div>
  </section>

  <div class="controls" id="controls">
    <div class="hint kb"><span class="kbd ar" aria-label="←"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span><span class="kbd ar" aria-label="→"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span data-i18n="hintMove"></span></div>
    <div class="hint kb"><span class="kbd">Esc</span><span data-i18n="hintPause"></span></div>
    <div class="tpad"><button id="tL" aria-label="Left">◀</button><button id="tR" aria-label="Right">▶</button></div>
    <div class="hint tp" data-i18n="hintTouch"></div>
    <button class="pausebtn" id="bPause"></button>
  </div>

  <section class="grid3">
    <div class="game-panel">
      <h2 data-i18n="levels"></h2>
      <div class="lvls lvwrap" id="lvls"></div>
      <p class="note" data-i18n="levelsNote"></p>
      <div class="ach"><h3 id="achTitle"></h3><div class="achrow" id="achRow"></div><p class="achtext" id="achText"></p></div>
      <div class="reset"><button class="linkbtn" id="bReset"></button></div>
    </div>
    <div class="game-panel">
      <h2><i class="g" aria-hidden="true">✓</i><span data-i18n="catchQ"></span></h2>
      <div class="items" id="legCatch"></div>
      <p class="note" id="noteCatch"></p>
    </div>
    <div class="game-panel">
      <h2><i class="r" aria-hidden="true">✕</i><span data-i18n="avoidQ"></span></h2>
      <div class="items" id="legAvoid"></div>
      <p class="note" id="noteAvoid"></p>
    </div>
  </section>

  <footer class="foot">
    <div class="l"><span class="logo" aria-hidden="true">&lt;/&gt;</span><div><b data-i18n="footTitle"></b><span data-i18n="footText"></span></div></div>
    <div class="r"><span data-i18n="footRight"></span> <a id="footLink" target="_blank" rel="noopener noreferrer">@lordrawl</a></div>
  </footer>
  <div class="sr" id="live" aria-live="polite"></div>

const maxV=()=>.44*W;
function diff(){
  const L=G.L;if(!L.endless)return{speed:L.speed,interval:L.interval,max:L.max,bad:L.badShare};
  const e=G.time;return{speed:Math.min(.8,.40+e*.0035),interval:Math.max(.5,.95-e*.004),max:Math.min(11,7+Math.floor(e/25)),bad:Math.min(.45,.28+e*.0012)}}
function pickId(){
  const L=G.L,D=diff();
  if(L.egg&&G.eggN<3&&(rnd()<.035||(G.eggN===0&&G.spawned>=22))){G.eggN++;return'production'}
  const hasCoffee=L.good.includes('coffee')||L.bonus.includes('coffee');
  if(hasCoffee&&G.lastId==='coffee'&&G.cChain<3&&rnd()<.3){G.cChain++;return'coffee'}
  const badOn=G.items.filter(i=>i.role==='bad').length;
  const forceGood=G.sinceGood>=2;
  if(!forceGood&&L.bad.length&&rnd()<D.bad&&badOn<3&&G.badRun<2)return pick(L.bad);
  if(L.bonus.length&&rnd()<L.bonusShare)return pick(L.bonus);
  if(!G.bag.length)G.bag=shuffle([...L.good]);
  return G.bag.pop();
}
function roleOf(id){const L=G.L;if(L.egg&&id==='production')return'bad';if(L.good.includes(id))return'good';if(L.bonus.includes(id))return'bonus';return'bad'}
function spawn(){
  const D=diff();const id=pickId();const role=roleOf(id);
  const base=D.speed*H;let v=base*rr(.8,1.2);

  const M=46,hwR=HW;let x;
  const clearOf=c=>!G.items.some(i=>(Math.abs(i.x-c)<78*IS&&i.y<150)||(role==='bad'&&i.role==='good'&&i.age<.6&&Math.abs(i.x-c)<130*IS));
  if(role==='good'&&G.lastGood){
    const minDt=.38;
    if(Math.abs(tc-G.lastGood.tc)<minDt){v=clamp(dist/(G.lastGood.tc+minDt-G.time),base*.8,base*1.2);tc=G.time+dist/v}
    const hw=.8*maxV()*Math.abs(tc-G.lastGood.tc);

    const score=c=>Math.min(...G.recentGood.map(g=>Math.abs(c-g.x)));
    const cand=[];for(let k=0;k<18;k++){const c=rr(lo,hi);if(Math.abs(c-G.lastGood.x)>=sep&&clearOf(c))cand.push(c)}
    if(cand.length){const far=cand.filter(c=>score(c)>=sepMin*.8);x=far.length?pick(far):cand.sort((a,b)=>score(b)-score(a))[0]}
    else x=clamp(G.lastGood.x+(rnd()<.5?-1:1)*Math.min(sep,hw),M,W-M);
  }else{
    let c=null;for(let k=0;k<10;k++){const t=rr(M,W-M);if(clearOf(t)){c=t;break}}
    x=c===null?rr(M,W-M):c;
  }
  G.items.push({id,role,x,y:-70,v,ph:rnd()*6.28,fq:rr(.4,.7),amp:rr(8,16)*IS,age:0,t:0,cx:x});
  G.spawned++;G.lastId=id;if(id!=='coffee')G.cChain=0;else if(!G.cChain)G.cChain=1;
  if(role==='good'){G.sinceGood=0;G.lastGood={x,tc};G.recentGood.unshift({x});G.recentGood.length=Math.min(3,G.recentGood.length);G.badRun=0}else{G.sinceGood++;G.badRun=role==='bad'?G.badRun+1:0}
}

/* ---------- gameplay ---------- */
function setOv(name,d){cat.ov=name;cat.ovT=d}
function addFloat(x,y,text,color){floats.push({x,y,text,color,life:.9,max:.9})}
function burst(x,y,color,n=9){if(reduced)n=3;for(let i=0;i<n;i++){const a=rnd()*6.28,s=rr(60,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5,max:.5,color,size:rr(2,4)})}}
function unlock(id){const d=store.data;if(d.achievements[id])return false;d.achievements[id]=new Date().toISOString();store.save();
  toast({small:t('achNew'),title:t('a_'+id),text:t('ad_'+id),ms:4200});setOv('ach',1.2);snd('ach');announce(t('achNew')+': '+t('a_'+id));renderAch();return true}
function catchItem(it){
  const info=ITEMS[it.id],role=it.role;const x=it.cx,y=it.y;
  G.items.splice(G.items.indexOf(it),1);
  if(role==='bad'){burst(x,y,ROLE.bad,12);onHit(it);return}
  G.score+=info.pts;if(role==='good'){G.progress++;G.caught++}
  addFloat(x,y-30,'+'+info.pts,role==='good'?ROLE.good:ROLE.bonus);burst(x,y,ROLE[role]);setOv('catch',.25);snd(role==='bonus'?'bonus':'catch');
  if(it.id==='coffee'){G.cStreak++;if(G.cStreak>=3){G.cStreak=0;G.buffT=8;unlock('caffeine')}}else G.cStreak=0;
  if(it.id==='docs'){G.dStreak++;if(G.dStreak>=3){G.dStreak=0;unlock('rtfm')}}else G.dStreak=0;
  updateHUD();
  if(G.L.endless){if(G.caught>=50)unlock('endless')}else if(G.progress>=G.L.goal)finish('win');
}
function onHit(it){
  G.cStreak=0;G.dStreak=0;G.lives--;G.hits++;G.invT=1.5;setOv('hit',.6);flash=.35;shake=reduced?0:.25;snd('hit');
  if(it.id==='production'&&G.L.egg)unlock('friday');
  updateHUD();announce(t('liveHit',{n:Math.max(0,G.lives)}));
  if(G.lives<=0)finish('lose');
}
function finish(kind){
  state='ending';G.endKind=kind;G.endT=kind==='win'?1.0:1.1;
  G.items.forEach(i=>burst(i.cx,i.y,'#ffffff',4));G.items=[];
  if(kind==='win'){setOv('win',9);snd('win')}else{setOv('lose',9);snd('lose');if(G.time<10&&!G.L.endless||G.time<10)unlock('sudo')}
  $('bPause').classList.remove('on');updateHUD();
}
function computeWin(){
  const L=G.L;const lives=G.lives;const items=G.score;
  const lifeB=lives*50;const speedB=Math.max(0,Math.round((L.par-G.time)*6));
  return{items,lifeB,speedB,total:items+lifeB+speedB,stars:lives,time:G.time}}
function saveResult(kind){
  const d=store.data;const L=G.L;
  if(L.endless){const rec=G.score>d.endlessBest;if(rec)d.endlessBest=G.score;store.save();return{rec}}
  const e=d.levels[L.id]||{completed:false,bestScore:0,stars:0,attempts:0,bestTime:0};e.attempts++;let rec=false;
  if(kind==='win'){const r=G.result;e.completed=true;if(r.total>e.bestScore){e.bestScore=r.total;rec=true}e.stars=Math.max(e.stars,r.stars);if(!e.bestTime||r.time<e.bestTime)e.bestTime=+r.time.toFixed(1);
    d.unlockedLevel=Math.max(d.unlockedLevel,Math.min(5,L.id+1));d.lastLevel=Math.min(L.id+1,5);if(L.id===5)d.lastLevel=5;}
  d.levels[L.id]=e;store.save();
  if(kind==='win'){if(G.hits===0)unlock('clean');if(G.lives===1)unlock('deadline');if(L.id===5)unlock('release')}
  return{rec}}

function startLevel(n){
  curLevel=n;const L=lvlOf(n);newRound(n);
  const d=store.data;d.lastLevel=Math.min(n,6);if(!d.seenBriefing.includes(n))d.seenBriefing.push(n);store.save();
  state='countdown';startCountdown(3,.5,()=>{state='playing';$('bPause').classList.add('on');
    announce(t('goalTitle'));});
  updateHUD();refreshAll(true);closeModal();
}
let cdTimer=null;
function startCountdown(n,step,done){
  const el=$('count');el.classList.add('on');let k=n;
  const tick=()=>{if(state!=='countdown'){el.classList.remove('on');return}
    if(k>0){el.innerHTML='<span>'+k+'</span>';snd('tick');k--;cdTimer=setTimeout(tick,step*1000)}
    else{el.classList.remove('on');done()}};
  clearTimeout(cdTimer);tick()}
function pauseGame(auto){
  if(state!=='playing')return;state='paused';$('bPause').classList.remove('on');keys.left=keys.right=false;ptr.active=false;
  openModal('pause')}
function resumeGame(){closeModal();state='countdown';startCountdown(1,.8,()=>{state='playing';$('bPause').classList.add('on')})}

function update(dt){
  if(!G)return;
  if(flash>0)flash-=dt;if(shake>0)shake-=dt;
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.life-=dt;f.y-=40*dt}floats=floats.filter(f=>f.life>0);
  if(cat.ovT>0){cat.ovT-=dt;if(cat.ovT<=0)cat.ov=null}
  if(state==='ending'){G.endT-=dt;if(G.endT<=0){const kind=G.endKind;state='modal';if(kind==='win'){G.result=computeWin()}G.saved=saveResult(kind);if(kind==='win'&&G.L&&!G.L.endless){var lvl=G.L.id;var st=store.data.levels[lvl];if(st&&document.getElementById('lv'+lvl)){document.getElementById('lv'+lvl).innerHTML=st.stars>=1?'<i>\u2605</i>'.repeat(st.stars)+'<i>\u2606</i>'.repeat(3-st.stars):'\u2014';}}openModal(kind==='win'?'won':(G.L.endless?'endlessOver':'lost'))}return}
  if(state!=='playing')return;
  G.time+=dt;if(G.buffT>0)G.buffT-=dt;if(G.invT>0)G.invT-=dt;
  // cat movement
  const mv=maxV();
  if(ptr.active){const v=clamp((ptr.x-cat.x)*9,-.7*W,.7*W);cat.v+=(v-cat.v)*Math.min(1,dt/.06)}
  else{const dir=(keys.left?-1:0)+(keys.right?1:0);cat.v+=(dir*mv-cat.v)*Math.min(1,dt/.08)}
  cat.x=clamp(cat.x+cat.v*dt,40,W-40);if(Math.abs(cat.v)>20)cat.face=cat.v>0?1:-1;
  // spawn
  const D=diff();G.spawnT-=dt;
  const maxItems=Math.round(D.max*(portrait?.7:1));
  if(G.spawnT<=0){if(G.items.length<maxItems){spawn();G.spawnT=D.interval*rr(.8,1.2)}else G.spawnT=.15}
  // items
  const hw=HW,rx0=cat.x-hw,rx1=cat.x+hw,ry0=groundY-CH-14,ry1=groundY-24,rad=26*IS;
  const slow=G.buffT>0?.6:1;
  for(const it of [...G.items]){
    it.y+=it.v*dt*slow;it.t+=dt;it.age+=dt;it.cx=it.x+Math.sin(it.ph+it.t*it.fq*6.283)*it.amp;
    if(state!=='playing')break;
    const nx=clamp(it.cx,rx0,rx1),ny=clamp(it.y,ry0,ry1);
    if((it.cx-nx)**2+(it.y-ny)**2<=rad*rad){
      if(it.role==='bad'&&G.invT>0){G.items.splice(G.items.indexOf(it),1);burst(it.cx,it.y,'#ffffff',6);continue}
      catchItem(it);continue}
    if(it.y>groundY-30){G.items.splice(G.items.indexOf(it),1);burst(it.cx,groundY-24,'#8fa0ff',3)}
  }
  updateHUD(true);
}

/* ---------- render ---------- */
const lblW={};
function labelWidth(id,k){const key=lang+id+k;if(lblW[key])return lblW[key];ctx.font='700 '+(13*k)+'px Manrope,system-ui,sans-serif';return lblW[key]=ctx.measureText(NAMES[id]).width}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawItem(it){
  const k=IS,col=ROLE[it.role],x=it.cx,y=it.y,r=30*k,cy=y-50*k;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1;ctx.beginPath();
  [-r,-r/3,r/3,r].forEach(dx=>{ctx.moveTo(x+dx,cy+8*k);ctx.lineTo(x,y-20*k)});ctx.stroke();
  const g=ctx.createLinearGradient(0,cy-r,0,cy+10*k);g.addColorStop(0,col);g.addColorStop(1,col+'88');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-r,cy+8*k);ctx.bezierCurveTo(x-r,cy-r*1.15,x+r,cy-r*1.15,x+r,cy+8*k);
  ctx.quadraticCurveTo(x+r*.67,cy+20*k,x+r/3,cy+8*k);ctx.quadraticCurveTo(x,cy+20*k,x-r/3,cy+8*k);ctx.quadraticCurveTo(x-r*.67,cy+20*k,x-r,cy+8*k);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(x-r/3,cy+8*k);ctx.quadraticCurveTo(x-r*.35,cy-r*.6,x-r*.12,cy-r*.85);ctx.moveTo(x+r/3,cy+8*k);ctx.quadraticCurveTo(x+r*.35,cy-r*.6,x+r*.12,cy-r*.85);ctx.stroke();
  const im=ICONIMG[it.id];if(im.complete)ctx.drawImage(im,x-27*k,y-27*k,54*k,54*k);
  const tw=labelWidth(it.id,k),pw=tw+18*k,ph=21*k,py=y+32*k;
  ctx.fillStyle='rgba(7,11,36,.88)';ctx.strokeStyle=col;ctx.lineWidth=1.6;rrect(x-pw/2,py,pw,ph,7*k);ctx.fill();ctx.stroke();
  ctx.fillStyle='#eef1ff';ctx.font='700 '+(13*k)+'px Manrope,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(NAMES[it.id],x,py+ph/2+1);
  ctx.restore();
}
function drawCat(now){
  let name='back';
  if(cat.ov)name=cat.ov;else if(state==='playing'&&Math.abs(cat.v)>40)name='run';else if(state==='idle'||state==='modal'&&!G)name='back';
  if(!cat.ov&&state==='idle'&&idleT>5)name='think';
  const s=SPR[name],im=SPRIMG[name];if(!im.complete)return;
  const sc=CH/SPR.back.h,w=s.w*sc,h=s.h*sc;let flip=name==='run'&&cat.face<0;
  let ax=AX[name];if(flip)ax=1-ax;

  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cat.x,groundY+6,36*(CH/150),6,0,0,7);ctx.fill();
  ctx.translate(cat.x,groundY+8-bob);if(flip)ctx.scale(-1,1);
  const dx=flip?-(w*(1-ax)):-w*ax;
  ctx.drawImage(im,dx,-h,w,h);ctx.restore();
  if(DEBUG){const hw=HW;ctx.strokeStyle='#ff0';ctx.strokeRect(cat.x-hw,groundY-CH-14,hw*2,CH-10)}
}
let idleT=0;
function render(now,dt){
  ctx.setTransform(SC,0,0,SC,0,0);
  let ox=0,oy=0;if(shake>0){ox=rr(-4,4);oy=rr(-4,4)}
  ctx.save();ctx.translate(ox,oy);
  ctx.drawImage(bgC,0,0,W,H);
  const px=(cat.x/W-.5);
  ctx.drawImage(layerFar,-30-px*8,0,W+60,H);ctx.drawImage(layerMid,-30-px*16,0,W+60,H);ctx.drawImage(layerNear,-30-px*28,0,W+60,H);
  // roof
  const rg=ctx.createLinearGradient(0,groundY,0,H);rg.addColorStop(0,'#101a55');rg.addColorStop(1,'#060a24');ctx.fillStyle=rg;ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle='rgba(91,124,255,.9)';ctx.fillRect(0,groundY,W,2);ctx.fillStyle='rgba(91,124,255,.2)';ctx.fillRect(0,groundY+2,W,6);
  // rain
  if(rain.length){ctx.strokeStyle='rgba(150,175,255,.28)';ctx.lineWidth=1;ctx.beginPath();for(const d of rain){d.y+=d.v*dt;d.x-=d.v*dt*.08;if(d.y>groundY){d.y=-20;d.x=rnd()*W+40}ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.l*.08,d.y+d.l)}ctx.stroke()}
  if(G){for(const it of G.items)drawItem(it)}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;
  drawCat(now);
  for(const f of floats){ctx.globalAlpha=Math.max(0,f.life/f.max);ctx.fillStyle=f.color;ctx.font='800 '+(18*IS)+'px Manrope,sans-serif';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){const a=Math.min(.5,flash*1.6);const g=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.85);g.addColorStop(0,'rgba(255,40,70,0)');g.addColorStop(1,'rgba(255,40,70,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(G&&G.buffT>0){ctx.fillStyle='rgba(255,170,60,.06)';ctx.fillRect(0,0,W,H)}

/* ---------- loop ---------- */
let last=0,acc=0,raf=0,visible=true;
function frame(ts){
  raf=requestAnimationFrame(frame);const dtr=Math.min(.1,(ts-last)/1000||0);last=ts;
  acc+=dtr;let n=0;while(acc>=1/60&&n<5){update(1/60);acc-=1/60;n++}if(n===5)acc=0;
  if(state==='idle'){idleT+=dtr}else idleT=0;
  render(ts,dtr);
}
function startLoop(){if(!raf&&visible&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
function stopLoop(){cancelAnimationFrame(raf);raf=0}

    return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'>"+catImg('front',120)
    +"<div class='eyebrow'>Frontend Game</div><h2 id='mt'>"+esc(has?t('welcomeBack'):t('welcomeT'))+'</h2><p>'+esc(has?t('welcomeBackText'):t('welcomeText'))+'</p>'
    +"<div class='acts'><button class='game-btn' data-act='welcome'>"+esc(has?t('cont',{n:curLevel>5?'∞':curLevel}):t('start'))+"</button></div><p style='margin:12px 0 0'><button class='linkbtn' data-act='how'>"+esc(t('how'))+'</button></p></div>'}
  if(kind==='brief'){const n=arg,B=lvlOf(n);const text=B.endless?t('endlessText'):t('lt'+n);
    const desc=retry?"<details><summary class='linkbtn' style='cursor:pointer'>"+esc(t('showDesc'))+'</summary><p>'+esc(text)+'</p></details>':'<p>'+esc(text)+'</p>';
    return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt'><div class='eyebrow'>"+esc(B.endless?'∞':t('briefLevel',{n}))+"</div><h2 id='mt'>"+esc(t('lv'+n))+'</h2>'+desc
    +(B.warn?"<p class='warn'>"+esc(t('warn3'))+'</p>':'')
    +"<div class='sec'><h4>"+esc(t('task')+(B.endless?'':': '+t('collect',{n:B.goal})))+"</h4><div class='chips'>"+B.good.map(i=>chip(i,'good')).join('')+'</div></div>'
    +(B.bonus.length?"<div class='sec'><h4>"+esc(t('bonusT'))+"</h4><div class='chips'>"+B.bonus.map(i=>chip(i,'bonus')).join('')+'</div></div>':'')
    +"<div class='sec'><h4>"+esc(t('avoid'))+"</h4><div class='chips'>"+B.bad.map(i=>chip(i,'bad')).join('')+'</div></div>'
    +"<div class='acts'><button class='game-btn' data-act='go' data-n='"+n+"'>"+esc(t('start'))+"</button><button class='game-btn game-btn--ghost' data-act='levels'>"+esc(t('toLevels'))+'</button></div></div>'}
  if(kind==='how')return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt'>"+catImg('front',96)+"<h2 id='mt' style='text-align:center'>"+esc(t('howT'))+"</h2><ol class='steps'>"
    +[1,2,3].map(i=>"<li><span class='n'>"+i+"</span><div><b>"+esc(t('how'+i))+'</b><span>'+esc(t('how'+i+'t'))+'</span></div></li>').join('')
    +"</ol><div class='acts'><button class='game-btn' data-act='closehow'>"+esc(t('got'))+'</button></div></div>';
  if(kind==='pause')return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'><h2 id='mt'>"+esc(t('paused'))+"</h2><div class='acts'><button class='game-btn' data-act='resume'>"+esc(t('resume'))+"</button><button class='game-btn game-btn--ghost' data-act='how'>"+esc(t('how'))+"</button><button class='game-btn game-btn--ghost' data-act='tolevels'>"+esc(t('toLevels'))+'</button></div></div>';
  if(kind==='won'){const r=G.result,sv=G.saved||{};let st='';for(let i=1;i<=3;i++)st+=i<=r.stars?'★':"<span class='off'>★</span>";
    return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'>"+catImg('win',104)+"<h2 id='mt'>"+esc(t('wonT'))+"</h2><div class='stars' aria-hidden='true'>"+st+'</div>'
    +"<dl class='stats' style='text-align:left'><dt>"+esc(t('sItems'))+'</dt><dd>'+r.items+'</dd><dt>'+esc(t('sLives'))+'</dt><dd>+'+r.lifeB+'</dd><dt>'+esc(t('sSpeed')+' ('+fmt(r.time)+')')+'</dt><dd>+'+r.speedB+"</dd><dt class='tot'>"+esc(t('sTotal'))+"</dt><dd class='tot'>"+r.total+'</dd></dl>'
    +(sv.rec?"<p style='color:var(--gold);font-weight:800'>"+esc(t('newRec'))+'</p>':'')
    +"<div class='acts'><button class='game-btn' data-act='next'>"+esc(L.id===5?t('toFinal'):t('next'))+"</button><button class='game-btn game-btn--ghost' data-act='again' data-n='"+L.id+"'>"+esc(t('again'))+"</button><button class='game-btn game-btn--ghost' data-act='tolevels'>"+esc(t('toLevels'))+'</button></div></div>'}
  if(kind==='lost')return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'>"+catImg('lose',84)+"<h2 id='mt'>"+esc(t('lostT'))+'</h2><p>'+esc(t('lostText',{a:G.progress,b:L.goal}))+"</p><div class='acts'><button class='game-btn' data-act='again' data-n='"+L.id+"'>"+esc(t('again'))+"</button><button class='game-btn game-btn--ghost' data-act='tolevels'>"+esc(t('toLevels'))+'</button></div></div>';
  if(kind==='endlessOver')return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'>"+catImg('lose',84)+"<h2 id='mt'>"+esc(t('endlessOver'))+"</h2><dl class='stats' style='text-align:left'><dt>"+esc(t('eCaught'))+'</dt><dd>'+G.caught+'</dd><dt>'+esc(t('score').replace(':',''))+'</dt><dd>'+G.score+"</dd><dt class='tot'>"+esc(t('eRecord'))+"</dt><dd class='tot'>"+store.data.endlessBest+'</dd></dl>'+(G.saved&&G.saved.rec?"<p style='color:var(--gold);font-weight:800'>"+esc(t('newRec'))+'</p>':'')
    +"<div class='acts'><button class='game-btn' data-act='again' data-n='6'>"+esc(t('again'))+"</button><button class='game-btn game-btn--ghost' data-act='tolevels'>"+esc(t('toLevels'))+'</button></div></div>';
  if(kind==='final'){const d=store.data;let stars=0,sc=0;for(let i=1;i<=5;i++){const l=d.levels[i];if(l){stars+=l.stars;sc+=l.bestScore}}const an=ACH.filter(a=>d.achievements[a.id]).length;
    return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'>"+catImg('win',112)+"<div class='eyebrow'>5 / 5</div><h2 id='mt'>"+esc(t('finalT'))+'</h2><p>'+esc(t('finalText'))+"</p><dl class='stats' style='text-align:left'><dt>"+esc(t('fStars'))+'</dt><dd>'+stars+' / 15</dd><dt>'+esc(t('fScore'))+'</dt><dd>'+sc+'</dd><dt>'+esc(t('fAch'))+'</dt><dd>'+an+' / '+ACH.length+'</dd></dl>'
    +"<div class='acts'><a class='game-btn' style='text-align:center;text-decoration:none' href='"+CONTACT.url+"' target='_blank' rel='noopener'>"+esc(t('contact'))+"</a><button class='game-btn game-btn--ghost' data-act='replay'>"+esc(t('playAgain'))+'</button></div></div>'}
  if(kind==='confirm')return"<div class='modal' role='dialog' aria-modal='true' aria-labelledby='mt' style='text-align:center'><h2 id='mt'>"+esc(arg.reset?t('resetQ'):t('confirmT'))+'</h2><p>'+esc(arg.reset?t('resetText'):t('confirmText'))+"</p><div class='acts'><button class='game-btn "+(arg.reset?'danger':'')+"' data-act='confirmyes'>"+esc(arg.reset?t('yesReset'):t('yes'))+"</button><button class='game-btn game-btn--ghost' data-act='confirmno'>"+esc(arg.reset?t('cancel'):t('no'))+'</button></div></div>';
  return'';
}
function openModal(kind,arg,silent){
  if(!curModal)lastFocus=document.activeElement;
  curModal={kind,arg};ml.innerHTML=modalHtml(kind,arg);ml.hidden=false;ml.scrollTop=0;idleBtn();
  const f=ml.querySelector('.game-btn');if(f&&!silent)f.focus({preventScroll:true});
}
function closeModal(){curModal=null;ml.hidden=true;ml.innerHTML='';idleBtn();try{lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})}catch(e){}}
function toIdle(){state='idle';G=null;cat.ov=null;$('bPause').classList.remove('on');$('count').classList.remove('on');clearTimeout(cdTimer);closeModal();updateHUD();refreshAll(true)}
function requestLevel(n){
  if(n>store.data.unlockedLevel)return;
  if(state==='playing'||state==='countdown'||state==='ending'||state==='paused'){
    if(state==='playing')pauseGame();
    openModal('confirm',{n});return}
  retry=false;curLevel=n;renderLevels();renderLegend();updateHUD();openModal('brief',n);
}
ml.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='welcome'){welcomed=true;retry=false;openModal('brief',curLevel);return}
  if(a==='go'){retry=false;const n=+b.dataset.n;if(b.dataset.brief){curLevel=n;openModal('brief',n);return}startLevel(n);return}
  if(a==='how'){howReturn=curModal;if(!howReturn||howReturn.kind==='how')howReturn=null;openModal('how');return}
  if(a==='closehow'){const r=howReturn;howReturn=null;if(r)openModal(r.kind,r.arg);else closeModal();return}
  if(a==='resume'){resumeGame();return}
  if(a==='levels'||a==='tolevels'){welcomed=true;toIdle();return}
  if(a==='next'){const L=G.L;if(L.id===5){openModal('final')}else{curLevel=L.id+1;retry=false;G=null;state='idle';renderLevels();renderLegend();updateHUD();openModal('brief',curLevel)}return}
  if(a==='again'){const n=+b.dataset.n;retry=true;curLevel=n;G=null;state='idle';renderLevels();renderLegend();updateHUD();openModal('brief',n);return}
  if(a==='replay'){retry=false;curLevel=1;G=null;state='idle';renderLevels();renderLegend();updateHUD();openModal('brief',1);return}
  if(a==='confirmyes'){const arg=curModal.arg;if(arg.reset){store.reset();curLevel=1;lang=store.data.lang;toIdle();welcomed=true;return}toIdle();welcomed=true;curLevel=arg.n;renderLevels();renderLegend();openModal('brief',arg.n);return}
  if(a==='confirmno'){const arg=curModal.arg;if(arg.reset){closeModal();return}if(state==='paused'){openModal('pause')}else if(state==='playing'){closeModal()}else openModal('pause');return}
});

/* ---------- input ---------- */
const isLeft=k=>k==='ArrowLeft'||k==='a'||k==='A'||k==='ф'||k==='Ф';
const isRight=k=>k==='ArrowRight'||k==='d'||k==='D'||k==='в'||k==='В';
addEventListener('keydown',e=>{
  const k=e.key;
  if(curModal){
    if(k==='Escape'){if(curModal.kind==='how'){ml.querySelector('[data-act=closehow]').click();e.preventDefault()}else if(curModal.kind==='pause'){resumeGame();e.preventDefault()}}
    if(k==='Tab'){const f=[...ml.querySelectorAll('button,a[href],summary')];if(!f.length)return;const i=f.indexOf(document.activeElement);
      if(e.shiftKey&&i<=0){f[f.length-1].focus();e.preventDefault()}else if(!e.shiftKey&&(i===f.length-1||i<0)){f[0].focus();e.preventDefault()}}
    return}
  if(state==='playing'||state==='countdown'){
    if(isLeft(k)){keys.left=true;e.preventDefault()}else if(isRight(k)){keys.right=true;e.preventDefault()}
    else if((k==='Escape'||k==='p'||k==='P'||k==='з'||k==='З')&&state==='playing'){pauseGame();e.preventDefault()}
  }
});
addEventListener('keyup',e=>{if(isLeft(e.key))keys.left=false;if(isRight(e.key))keys.right=false});
addEventListener('blur',()=>{keys.left=keys.right=false;ptr.active=false;if(state==='playing')pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='playing')pauseGame();stopLoop()}else startLoop()});
function px(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{if(state!=='playing'&&state!=='countdown')return;ptr.active=true;ptr.x=px(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(ptr.active)ptr.x=px(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cv.addEventListener(ev,()=>{ptr.active=false}));
[['tL','left'],['tR','right']].forEach(([id,k])=>{const b=$(id);b.addEventListener('pointerdown',e=>{keys[k]=true;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false}));b.addEventListener('contextmenu',e=>e.preventDefault())});
$('bPause').addEventListener('click',()=>pauseGame());
$('idleBtn').addEventListener('click',()=>{retry=false;openModal('brief',curLevel)});
$('bHow').addEventListener('click',()=>{if(state==='playing')pauseGame();howReturn=curModal&&curModal.kind!=='how'?curModal:null;openModal('how')});
$('bLang').addEventListener('click',()=>{lang=lang==='ru'?'en':'ru';store.data.lang=lang;store.save();refreshAll()});
$('bSound').addEventListener('click',()=>{const d=store.data;d.sound=!d.sound;store.save();if(d.sound&&!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();if(d.sound)snd('catch');refreshAll(true)});
$('bReset').addEventListener('click',()=>{if(state==='playing')pauseGame();openModal('confirm',{reset:true})});
$('lvls').addEventListener('click',e=>{const b=e.target.closest('.lv');if(b&&!b.disabled)requestLevel(+b.dataset.n)});
$('achRow').addEventListener('click',e=>{const b=e.target.closest('.badge');if(b){achSel=b.dataset.a;renderAch()}});
function legendClick(e,note){const b=e.target.closest('.it');if(!b)return;const id=b.dataset.id;$(note).textContent=NAMES[id]+' — '+t('d_'+id);
  document.querySelectorAll('.it.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
$('legCatch').addEventListener('click',e=>legendClick(e,'noteCatch'));
$('legAvoid').addEventListener('click',e=>legendClick(e,'noteAvoid'));

/* ---------- init ---------- */
if(!store.ok)store.warn();
layout();
new ResizeObserver(()=>layout()).observe(stage);
addEventListener('resize',()=>layout());
new IntersectionObserver(es=>{const r=es[0].intersectionRatio;visible=es[0].isIntersecting;
  if(visible)startLoop();else stopLoop();if(r<.3&&state==='playing')pauseGame()},{threshold:[0,.3]}).observe(stage);
refreshAll(true);
openModal('welcome',null,true);
startLoop();
if(DEBUG)window.__fg={get G(){return G},get state(){return state},cat,store,startLevel,LEVELS,update,unlock};
})();
</script>
</body>
</html>
